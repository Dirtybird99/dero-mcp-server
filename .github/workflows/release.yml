name: Release

# Tag-triggered release pipeline. Push a v* tag to publish everywhere:
#   git tag v0.4.3 && git push origin v0.4.3
#
# Pipeline (each stage gates the next):
#   verify  → tag must equal package.json version, full test suite green
#   npm     → keyless OIDC publish + provenance (no token; trusted publisher
#             configured on npmjs.com for repo DHEBP/dero-mcp-server + release.yml)
#   registry→ mcp-publisher publish via github-oidc (keyless)
#   deploy  → ssh to the VPS, pin DERO_MCP_VERSION to this release, redeploy
#   probe   → verify both legacy and 2026 clients against mcp.derod.org
#   release → GitHub Release + runtime-derived MCP surface manifest
#   docs    → dispatch the verified release to dero-docs with a GitHub App
#
# Auth model: OIDC everywhere except the VPS (SSH key secrets, unavoidable).
# Required repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY, DEPLOY_PORT,
#   MCP_SYNC_APP_PRIVATE_KEY. Required repo variable: MCP_SYNC_APP_ID.
# One-time npmjs.com setup: package access → trusted publisher → GitHub Actions,
#   owner dhebp, repo dero-mcp-server, workflow release.yml.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # ── Gate: the tag must match the committed version, and the full suite
  #    (the same one CI runs) must pass before anything irreversible ships.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump or retag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Version pin agrees across all refs
        run: npm run check:server-json

      - run: npx tsc --noEmit

      - run: npm run build

      - name: Export runtime MCP surface
        env:
          MCP_RELEASE_TAG: ${{ github.ref_name }}
          MCP_SOURCE_SHA: ${{ github.sha }}
        run: npm run --silent export:surface > mcp-surface.json

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-surface
          path: mcp-surface.json
          if-no-files-found: error
          retention-days: 7

      - run: npm run check:mcp-descriptions
      - run: npm run check:citations
      - run: npm run check:curve-fixtures
      - run: npm run check:proof-roundtrip
      - run: npm run check:tx-parse
      - run: npm run check:forge-demo
      - run: npm run check:verify-supply

      - name: Smoke + flow tests
        env:
          DERO_DAEMON_URL: ${{ secrets.DERO_DAEMON_URL || '' }}
        run: |
          npm run smoke:mcp
          npm run smoke:docs
          npm run test:flows
          npm run test:composites

  # ── npm: keyless OIDC publish. No NODE_AUTH_TOKEN — trusted publishing
  #    issues a short-lived credential and stamps provenance automatically.
  npm-publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC: lets the runner prove its identity to npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      # The bundled docs index is committed (regenerated separately by
      # refresh-docs-bundle.yml when dero-docs changes) and shipped via
      # files[]. prepack only compiles TS — it must NOT rebuild the index,
      # which needs the dero-docs monorepo absent here. Assert the committed
      # index is present and non-trivial before the irreversible publish.
      - name: Verify committed docs index ships
        run: |
          node -e "const i=require('./data/docs-index.json'); if(!i.page_count||i.page_count<1){console.error('docs-index.json has no pages');process.exit(1)} console.log('docs-index.json ok: '+i.page_count+' pages')"
      # Compile here too so a build failure surfaces before the publish call.
      - run: npm run build
      - name: Ensure npm >= 11.5.1 (trusted publishing)
        run: |
          npm install -g npm@latest
          # Fail loudly if the upgrade didn't take — otherwise OIDC publish
          # errors are cryptic instead of "npm too old".
          node -e "const v=require('child_process').execSync('npm -v').toString().trim();const[a,b]=v.split('.').map(Number);if(a<11||(a===11&&b<5)){console.error('npm '+v+' < 11.5.1');process.exit(1)}console.log('npm '+v+' ok')"
      - name: Publish to npm (OIDC + provenance)
        # Idempotent: if this exact version is already on npm (e.g. a re-run
        # after a later stage like registry-publish failed), skip the publish
        # instead of erroring on the duplicate, so the downstream registry /
        # deploy / release stages can complete on a re-trigger.
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG}@${VER} already on npm — skipping publish (idempotent re-run)."
          else
            npm publish --provenance --access public
          fi

  # ── MCP registry: keyless OIDC. mcp-publisher reads server.json; the
  #    io.github.DHEBP/* namespace is verified against the repo identity.
  #    Runs after npm because the registry validates the npm version exists.
  registry-publish:
    needs: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate server.json namespace
        run: |
          NAME="$(node -p "require('./server.json').name")"
          echo "server.json name: $NAME"
          case "$NAME" in
            io.github.DHEBP/*) echo "namespace ok" ;;
            *) echo "::error::server.json name '$NAME' is not under the io.github.DHEBP/* namespace"; exit 1 ;;
          esac
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP registry
        run: ./mcp-publisher publish

  # ── Deploy: refresh the VPS config, pin DERO_MCP_VERSION to this release,
  #    rebuild. The container installs dero-mcp-server@<version> from npm, so
  #    this MUST run after npm-publish (enforced via needs).
  deploy:
    needs: [npm-publish, registry-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy mcp.derod.org
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # ssh-action does NOT forward step-level env: into the remote shell.
          # Vars must be named here to reach the script.
          envs: GITHUB_REF_NAME
          script: |
            set -euo pipefail
            VERSION="${GITHUB_REF_NAME#v}"
            cd /opt/dero-mcp-server
            # Deterministic: make the checkout EXACTLY match origin/main, ignoring
            # any local drift on the box (a `git pull` aborts on local edits).
            # .env is gitignored, so the live config + auth token are untouched.
            git fetch origin main
            git reset --hard origin/main
            cd deploy
            # Pin the live container to the version just published to npm.
            # Operate on the real .env (compose reads it), creating it from the
            # template on first deploy if absent.
            [ -f .env ] || cp .env.example .env
            if grep -q '^DERO_MCP_VERSION=' .env; then
              sed -i "s|^DERO_MCP_VERSION=.*|DERO_MCP_VERSION=${VERSION}|" .env
            else
              echo "DERO_MCP_VERSION=${VERSION}" >> .env
            fi
            docker compose up -d --build mcp
            # The mcp service is expose-only (Caddy fronts it), so 8787 is not on
            # the host — probe health INSIDE the container's namespace, and poll
            # to tolerate Node's startup time.
            CID="$(docker compose ps -q mcp)"
            ok=
            for i in $(seq 1 15); do
              if docker exec "$CID" wget -qO- http://127.0.0.1:8787/health 2>/dev/null | grep -q "\"version\":\"${VERSION}\""; then
                ok=1; echo "live server reports ${VERSION} (attempt $i)"; break
              fi
              sleep 2
            done
            [ -n "$ok" ] || { echo "::error::health check did not report ${VERSION} after retries"; docker logs --tail 30 "$CID" || true; exit 1; }
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # npm + registry already published by the time we deploy, so a deploy
      # failure leaves the package live but mcp.derod.org stale. Make the
      # failure email actionable with the recovery path.
      - name: Report deploy failure
        if: failure()
        run: |
          {
            echo "## ❌ VPS deploy failed — npm/registry are published, but mcp.derod.org is STALE"
            echo ""
            echo "**Version:** ${GITHUB_REF_NAME#v}"
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "The package shipped; only the live server didn't update. Recover by"
            echo "re-running just this job once the box is fixed:"
            echo '\`gh run rerun ${{ github.run_id }} --failed\`'
            echo ""
            echo "Common causes: VPS disk/inodes, Docker build, or the health check."
            echo "See \`docs/DOCS-BUNDLE-SYNC.md\` and \`deploy/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

  # ── Hosted verification: publishing and the VPS deploy are not enough.
  #    Exercise the public route with both supported protocol eras before a
  #    release is announced or downstream docs are changed.
  verify-hosted:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Probe mcp.derod.org
        env:
          DERO_MCP_BASE_URL: https://mcp.derod.org
          DERO_MCP_EXPECT_VERSION: ${{ github.ref_name }}
        run: |
          DERO_MCP_EXPECT_VERSION="${DERO_MCP_EXPECT_VERSION#v}" npm run smoke:hosted

  # ── GitHub Release: cut from the tag, notes pulled from CHANGELOG.md.
  github-release:
    needs: [npm-publish, registry-publish, deploy, verify-hosted]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mcp-surface
      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the block between "## [VERSION]" and the next "## [".
          # index() does a LITERAL match — the [ ] in "[0.4.3]" are regex
          # metacharacters, so a `~` regex match would silently find nothing.
          awk -v v="## [${VERSION}]" '
            index($0, v) == 1 {f=1; next}
            f && index($0, "## [") == 1 {exit}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          LINES=$(wc -l < RELEASE_NOTES.md)
          echo "Extracted ${LINES} lines of notes"
          if [ "${LINES}" -eq 0 ]; then
            echo "::error::No CHANGELOG section found for ${VERSION}"; exit 1
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            mcp-surface.json

  # ── Docs sync: a narrowly installed GitHub App issues a short-lived token.
  #    dero-docs validates the release asset and opens a reviewable PR.
  docs-sync-dispatch:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Mint dero-docs token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MCP_SYNC_APP_ID }}
          private-key: ${{ secrets.MCP_SYNC_APP_PRIVATE_KEY }}
          owner: DHEBP
          repositories: dero-docs
      - name: Notify dero-docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            '{event_type:"mcp-release-published",client_payload:{tag:$tag,source_sha:$source_sha,asset_name:"mcp-surface.json"}}' \
          | gh api --method POST repos/DHEBP/dero-docs/dispatches --input -
