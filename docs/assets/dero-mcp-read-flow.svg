<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">How the DERO MCP server answers a read request</title>
  <desc id="description">An MCP client sends a read request to the DERO MCP server. The server reads live chain state from a selected DERO daemon and retrieves offline documentation and packaged skills from its bundled knowledge index.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.58" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#0a1c3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f86e8"/>
      <stop offset="1" stop-color="#37c8f0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#37c8f0"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      .card { fill: #111c30; stroke: #2b3d5d; stroke-width: 1.5; }
      .eyebrow { fill: #37c8f0; font-size: 13px; font-weight: 750; letter-spacing: 1.7px; }
      .heading { fill: #e8edf7; font-size: 24px; font-weight: 760; }
      .detail { fill: #a8b4ca; font-size: 15px; }
      .chip { fill: #0b1627; stroke: #2b3d5d; stroke-width: 1; }
      .chip-text { fill: #c4cde0; font-size: 12px; font-weight: 700; letter-spacing: 0.7px; text-anchor: middle; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="28" fill="url(#canvas)" stroke="#273653" stroke-width="2"/>
  <circle cx="1080" cy="42" r="210" fill="#37c8f0" opacity="0.055"/>
  <circle cx="94" cy="406" r="170" fill="#2f86e8" opacity="0.05"/>

  <text x="54" y="58" class="heading sans">One read path, two evidence sources</text>
  <text x="54" y="86" class="detail sans">Live daemon state and bundled knowledge stay separate and inspectable.</text>
  <rect x="54" y="103" width="176" height="4" rx="2" fill="url(#accent)"/>

  <g class="sans">
    <rect class="card" x="54" y="154" width="258" height="146" rx="20"/>
    <text class="eyebrow" x="80" y="188">MCP CLIENT</text>
    <text class="heading" x="80" y="226">Ask in plain language</text>
    <text class="detail" x="80" y="257">Local stdio or remote HTTP</text>
    <rect class="chip" x="80" y="270" width="92" height="25" rx="12.5"/>
    <text class="chip-text" x="126" y="287">READ CALL</text>

    <rect x="412" y="136" width="310" height="182" rx="22" fill="#101e34" stroke="#37c8f0" stroke-width="1.8"/>
    <rect x="438" y="162" width="48" height="48" rx="13" fill="url(#accent)"/>
    <path d="M451 176h12c8 0 13 4 13 10s-5 10-13 10h-12Zm10 7h-3v6h3c4 0 7-1 7-3s-3-3-7-3Z" fill="#07101f"/>
    <text class="eyebrow" x="506" y="180">DERO MCP</text>
    <text class="heading" x="438" y="244">Route, validate, explain</text>
    <text class="detail" x="438" y="276">Read-only tools with structured results</text>
    <rect class="chip" x="438" y="286" width="112" height="25" rx="12.5"/>
    <text class="chip-text" x="494" y="303">NO WALLET RPC</text>
    <rect class="chip" x="560" y="286" width="134" height="25" rx="12.5"/>
    <text class="chip-text" x="627" y="303">NO KEY CUSTODY</text>

    <rect class="card" x="822" y="122" width="324" height="118" rx="20"/>
    <text class="eyebrow" x="848" y="156">SELECTED DERO DAEMON</text>
    <text class="heading" x="848" y="193">Live chain state</text>
    <text class="detail" x="848" y="220">Blocks · transactions · contracts</text>

    <rect class="card" x="822" y="266" width="324" height="118" rx="20"/>
    <text class="eyebrow" x="848" y="300">BUNDLED KNOWLEDGE</text>
    <text class="heading" x="848" y="337">Docs and skills</text>
    <text class="detail" x="848" y="364">Offline index · canonical Markdown</text>
  </g>

  <path d="M312 227H396" fill="none" stroke="#37c8f0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M722 207H786Q802 207 802 191V181Q802 181 806 181H812" fill="none" stroke="#37c8f0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M722 254H786Q802 254 802 270V325Q802 325 806 325H812" fill="none" stroke="#37c8f0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <text x="600" y="388" class="mono" fill="#7f8ca8" font-size="13" text-anchor="middle">READ-ONLY · NO WALLET RPC · NO SIGNING · NO BROADCASTS · NO CONTRACT INVOCATION</text>
</svg>
